server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Archivos con hash: caché larga.
  location ~* \.(?:js|css|woff2?|webp|svg)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Fallback de SPA: cualquier ruta del router de React sirve index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
